<form id="edit_transcript_form" class="edit_form edit_transcript_form">
    <div class="form_field">
        <p><label for="transcriptInput">Transcript</label></p>
        <textarea id="transcriptInput" name="transcript" style="width: 40rem; height:4rem"><%= _.escape(metadata.transcript) %></textarea>
    </div>

    <div class="update_field">
        <input type="submit" id="edit_transcript_submit_button" class="update_button" value="Save Changes" />
    </div>

    <div class="errors">
        <h3>Errors</h3>
        <div class="error_stack">
        </div>
    </div>
</form>
